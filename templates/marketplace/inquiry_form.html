{% extends "base.html" %}
{% block title %}Send Inquiry{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-2xl border border-gray-200 shadow-sm p-6">
    <h1 class="text-2xl font-bold mb-6">Send Inquiry</h1>
    <form method="post" class="ajax-form space-y-4">
        {% csrf_token %}
        <div class="ajax-errors"></div>
        <div class="ajax-success"></div>
        {% include "partials/form_fields.html" %}
        <button type="submit" class="rounded-lg bg-blue-600 px-5 py-3 text-white font-semibold hover:bg-blue-700">
            Send
        </button>
    </form>
</div>
{% endblock %}
