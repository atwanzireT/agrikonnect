{% extends "base.html" %}
{% block title %}Upload Listing Image{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-2xl border border-gray-200 shadow-sm p-6">
    <h1 class="text-2xl font-bold mb-6">Upload Listing Image</h1>
    <form method="post" enctype="multipart/form-data" class="ajax-form space-y-4">
        {% csrf_token %}
        <div class="ajax-errors"></div>
        <div class="ajax-success"></div>
        {% include "partials/form_fields.html" %}
        <button type="submit" class="rounded-lg bg-green-700 px-5 py-3 text-white font-semibold hover:bg-green-800">
            Upload
        </button>
    </form>
</div>
{% endblock %}
