{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <div class="mb-6 flex items-center justify-between gap-4">
        <div>
            <p class="text-sm font-bold uppercase tracking-widest text-green-700">Price comparison</p>
            <h1 class="text-3xl font-black text-slate-900">{{ title }}</h1>
            <p class="mt-1 text-sm text-slate-500">Record what a company is offering for a farm product.</p>
        </div>
        <a href="{% url 'prices:company_price_compare' %}" class="rounded-full border border-green-100 bg-white px-5 py-3 text-sm font-bold text-green-800 shadow-sm hover:bg-green-50">
            <i class="fas fa-arrow-left mr-2"></i>Compare Prices
        </a>
    </div>

    <form method="post" class="rounded-3xl border border-green-100 bg-white p-6 shadow-sm">
        {% csrf_token %}
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            {% include "partials/form_fields.html" %}
        </div>
        <div class="mt-6 flex justify-end">
            <button type="submit" class="rounded-full bg-green-700 px-6 py-3 font-black text-white hover:bg-green-800">
                Save Company Price
            </button>
        </div>
    </form>
</div>
{% endblock %}
