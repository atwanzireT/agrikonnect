{% extends "base.html" %}
{% block title %}Upload Business Documents{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
    <h1 class="text-2xl font-bold mb-6">Upload Verification Document</h1>

    <form method="post" enctype="multipart/form-data" class="ajax-form space-y-4">
        {% csrf_token %}
        <div class="ajax-errors"></div>
        <div class="ajax-success"></div>
        {% include "partials/form_fields.html" %}

        <button type="submit" class="rounded-lg bg-green-700 px-5 py-3 text-white font-semibold hover:bg-green-800">
            Upload Document
        </button>
    </form>
</div>
{% endblock %}
